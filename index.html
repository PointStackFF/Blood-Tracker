<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ISBT scanner test</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; background: #f4f4f5; color: #18181b; max-width: 520px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: #71717a; font-size: 14px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #d4d4d8; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  #stage { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; margin-bottom: 14px; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #reticle { position: absolute; inset: 32% 5%; border: 2px solid rgba(255,255,255,.9); border-radius: 8px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.28); }
  #hud { position: absolute; left: 10px; bottom: 10px; color: #fff; font: 12px/1.4 ui-monospace, Menlo, monospace; text-shadow: 0 1px 3px #000; }
  button {
    font: inherit; font-weight: 600; width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid #d4d4d8; background: #fff; color: #18181b; margin-top: 10px; cursor: pointer;
  }
  button.primary { background: #18181b; color: #fff; border-color: #18181b; }
  button.go { background: #15803d; color: #fff; border-color: #15803d; }
  button:disabled { opacity: .4; }
  select, input[type=range] { font: inherit; width: 100%; margin-top: 10px; }
  select { padding: 12px; border-radius: 12px; border: 1px solid #d4d4d8; background: #fff; }
  .hit { border-left: 4px solid #16a34a; padding: 12px; background: #f0fdf4; border-radius: 8px; margin-bottom: 10px; }
  .hit code { font-size: 15px; word-break: break-all; display: block; font-weight: 600; }
  .raw { font: 12px/1.5 ui-monospace, Menlo, monospace; color: #3f3f46; background: #fff;
         border: 1px solid #d4d4d8; border-radius: 6px; padding: 8px; margin-top: 8px; word-break: break-all; }
  .miss { border-left: 4px solid #b91c1c; background: #fef2f2; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
  .meta { color: #52525b; font-size: 13px; margin-top: 4px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #f4f4f5; }
  .row span:last-child { font-family: ui-monospace, Menlo, monospace; text-align: right; }
  .ok { color: #15803d; font-weight: 600; }
  .bad { color: #b91c1c; font-weight: 600; }
  .empty { color: #71717a; font-size: 14px; }
  #banner { border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 14px; display: none; }
  #banner.loading { display: block; background: #eff6ff; border: 1px solid #93c5fd; color: #1e3a8a; }
  #banner.error { display: block; background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; }
  #banner.good { display: block; background: #f0fdf4; border: 1px solid #86efac; color: #14532d; }
</style>
</head>
<body>

<h1>ISBT scanner test</h1>
<div class="sub">ZXing C++ via WebAssembly. Nothing is stored or sent anywhere.</div>

<div id="banner" class="loading">Loading the decoder…</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="reticle"></div>
  <div id="hud"></div>
</div>

<div class="card">
  <select id="cameras"></select>
  <button id="start" class="primary" disabled>Start camera</button>
  <div id="zoomWrap" style="display:none">
    <div class="meta" style="margin-top:12px">Zoom — fill the frame with just the barcode</div>
    <input type="range" id="zoom" />
  </div>
  <button id="torch" disabled>Torch</button>
  <button id="stop" disabled>Stop</button>
</div>

<div class="card">
  <h2>Photo fallback</h2>
  <div class="meta">Full-resolution still. Best chance on a curved label.</div>
  <input type="file" id="photo" accept="image/*" capture="environment" style="display:none" />
  <button class="go" id="photoBtn" disabled>Take a photo of the barcode</button>
</div>

<div class="card">
  <h2>Decodes</h2>
  <div id="hits"><div class="empty">Nothing yet.</div></div>
</div>

<div class="card">
  <h2>Diagnostics</h2>
  <div id="env"></div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const video = $("video");
let readBarcodes = null, wasmVersion = "", track = null, scanning = false, frames = 0, started = 0;
const seen = new Set();

/* zxing-wasm 3.x defaults already enable tryHarder / tryRotate / tryInvert /
   tryDownscale. Leaving `formats` unset means every readable format, which is
   what we want while we're still finding out what these labels carry. */
const OPTS = { maxNumberOfSymbols: 4, minLineCount: 2 };

function setBanner(kind, msg) {
  const b = $("banner");
  b.className = kind || "";
  b.textContent = msg || "";
  if (!kind) b.style.display = "none";
}

/* ---- load the decoder ----------------------------------------------------
   Module is at dist/es/reader/index.js but the wasm binary lives at
   dist/reader/zxing_reader.wasm, so the default relative lookup misses. */
const V = "3.1.3";
const BASE = `https://cdn.jsdelivr.net/npm/zxing-wasm@${V}`;

try {
  const mod = await import(`${BASE}/dist/es/reader/index.js`);
  mod.prepareZXingModule({
    overrides: {
      locateFile: (path, prefix) =>
        path.endsWith(".wasm") ? `${BASE}/dist/reader/${path}` : prefix + path,
    },
  });
  readBarcodes = mod.readBarcodes;
  wasmVersion = mod.ZXING_WASM_VERSION || V;
  setBanner("good", `Decoder ready (zxing-wasm ${wasmVersion}).`);
  setTimeout(() => setBanner(null), 2500);
  $("start").disabled = false;
  $("photoBtn").disabled = false;
} catch (e) {
  setBanner("error", "Decoder failed to load: " + (e && e.message ? e.message : e));
}

/* ---- diagnostics ---- */
function diag() {
  const s = track && track.getSettings ? track.getSettings() : {};
  const rows = [
    ["Secure context", window.isSecureContext],
    ["Camera API", !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)],
    ["WASM decoder", !!readBarcodes],
  ].map(([k, v]) => `<div class="row"><span>${k}</span><span class="${v ? "ok" : "bad"}">${v ? "yes" : "no"}</span></div>`);
  if (wasmVersion) rows.push(`<div class="row"><span>zxing-wasm</span><span>${wasmVersion}</span></div>`);
  if (s.width) {
    rows.push(`<div class="row"><span>Stream resolution</span><span>${s.width}×${s.height}</span></div>`);
    rows.push(`<div class="row"><span>Frames decoded</span><span id="fr">${frames}</span></div>`);
  }
  rows.push(`<div class="row"><span>Browser</span></div><div class="meta">${navigator.userAgent}</div>`);
  $("env").innerHTML = rows.join("");
}
diag();

/* ---- results ---- */
function escapeRaw(s) {
  return Array.from(s).map(c => {
    const cp = c.codePointAt(0);
    return (cp < 32 || cp === 127) ? `\\x${cp.toString(16).padStart(2, "0")}` : c;
  }).join("");
}

function record(res, source) {
  const text = res.text ?? "";
  const key = text + "|" + source;
  if (seen.has(key)) return;
  seen.add(key);
  const secs = started ? ((performance.now() - started) / 1000).toFixed(1) + "s" : "—";
  const bytes = res.bytes ? Array.from(res.bytes).map(b => b.toString(16).padStart(2, "0")).join(" ") : "";
  const el = document.createElement("div");
  el.className = "hit";
  el.innerHTML = `<code>${escapeRaw(text).replace(/[<>&]/g, "")}</code>
    <div class="meta">${res.format || "?"}${res.symbologyIdentifier ? " · " + res.symbologyIdentifier : ""} · ${source} · ${secs}</div>
    ${bytes ? `<div class="raw">bytes: ${bytes}</div>` : ""}`;
  const box = $("hits");
  if (box.querySelector(".empty")) box.innerHTML = "";
  box.prepend(el);
  if (navigator.vibrate) navigator.vibrate(60);
}

function miss(msg) {
  const el = document.createElement("div");
  el.className = "miss";
  el.textContent = msg;
  const box = $("hits");
  if (box.querySelector(".empty")) box.innerHTML = "";
  box.prepend(el);
}

/* ---- cameras ---- */
async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === "videoinput");
    $("cameras").innerHTML = cams.length
      ? cams.map((c, i) => `<option value="${c.deviceId}">${c.label || "Camera " + (i + 1)}</option>`).join("")
      : `<option value="">Default camera</option>`;
    // The plain wide lens focuses closer than tele or ultrawide.
    const back = cams.find(c => /back|rear/i.test(c.label) && !/tele|ultra/i.test(c.label))
              || cams.find(c => /back|rear|environment/i.test(c.label));
    if (back) $("cameras").value = back.deviceId;
  } catch (e) {}
}
listCameras();

/* ---- live scanning ---- */
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

async function loop() {
  if (!scanning) return;
  if (video.readyState >= 2 && video.videoWidth) {
    // Middle band only, at native resolution — that's where the barcode sits.
    const w = video.videoWidth, h = video.videoHeight;
    const bandH = Math.round(h * 0.42), y = Math.round((h - bandH) / 2);
    canvas.width = w; canvas.height = bandH;
    ctx.drawImage(video, 0, y, w, bandH, 0, 0, w, bandH);
    try {
      const results = await readBarcodes(ctx.getImageData(0, 0, w, bandH), OPTS);
      frames++;
      const fr = $("fr"); if (fr) fr.textContent = frames;
      for (const r of results) if (r.text) record(r, "live");
    } catch (e) {
      scanning = false;
      miss("Live decode failed: " + (e && e.message ? e.message : e));
      return;
    }
  }
  requestAnimationFrame(loop);
}

async function start() {
  $("start").disabled = true;
  try {
    const deviceId = $("cameras").value || undefined;
    const base = { width: { ideal: 1920 }, height: { ideal: 1080 },
                   advanced: [{ focusMode: "continuous" }] };
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: deviceId ? { deviceId: { exact: deviceId }, ...base }
                      : { facingMode: { ideal: "environment" }, ...base },
    });
    video.srcObject = stream;
    await video.play();
    track = stream.getVideoTracks()[0];

    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $("torch").disabled = !("torch" in caps);
    if (caps.zoom) {
      $("zoomWrap").style.display = "block";
      $("zoom").min = caps.zoom.min; $("zoom").max = caps.zoom.max;
      $("zoom").step = caps.zoom.step || 0.1;
      $("zoom").value = track.getSettings().zoom || caps.zoom.min;
    }

    const s = track.getSettings();
    $("hud").textContent = `${s.width}×${s.height}`;
    $("stop").disabled = false;
    $("start").textContent = "Scanning…";
    started = performance.now(); frames = 0; scanning = true;
    loop();
    await listCameras();
    diag();
  } catch (e) {
    $("start").disabled = false;
    $("start").textContent = "Start camera";
    setBanner("error", "Camera didn't start: " + (e && e.message ? e.message : e));
  }
}

function stop() {
  scanning = false;
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  video.srcObject = null; track = null;
  $("start").disabled = false; $("start").textContent = "Start camera";
  $("stop").disabled = true; $("torch").disabled = true;
  $("zoomWrap").style.display = "none";
}

/* ---- photo fallback: the Blob straight in, then tighter centre crops ---- */
$("photoBtn").addEventListener("click", () => $("photo").click());
$("photo").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  started = 0;
  try {
    let found = false;
    for (const r of await readBarcodes(file, OPTS)) {
      if (r.text) { record(r, "photo"); found = true; }
    }
    if (!found) {
      const bmp = await createImageBitmap(file);
      for (const crop of [0.8, 0.6, 0.4]) {
        const cw = Math.round(bmp.width * crop), ch = Math.round(bmp.height * crop);
        const cv = document.createElement("canvas");
        cv.width = cw; cv.height = ch;
        const c2 = cv.getContext("2d", { willReadFrequently: true });
        c2.drawImage(bmp, (bmp.width - cw) / 2, (bmp.height - ch) / 2, cw, ch, 0, 0, cw, ch);
        for (const r of await readBarcodes(c2.getImageData(0, 0, cw, ch), OPTS)) {
          if (r.text) { record(r, `photo crop ${Math.round(crop * 100)}%`); found = true; }
        }
        if (found) break;
      }
      if (!found) miss(`No barcode found in that ${bmp.width}×${bmp.height} photo. Flatten the label, fill the frame, and angle slightly to kill the glare.`);
    }
  } catch (e) {
    miss("Photo decode failed: " + (e && e.message ? e.message : e));
  }
});

$("start").addEventListener("click", start);
$("stop").addEventListener("click", stop);
$("torch").addEventListener("click", async () => {
  if (!track) return;
  const on = track.getSettings().torch;
  try { await track.applyConstraints({ advanced: [{ torch: !on }] }); } catch (e) {}
});
$("zoom").addEventListener("input", async (e) => {
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] }); } catch (err) {}
});
$("cameras").addEventListener("change", () => { if (!$("stop").disabled) { stop(); start(); } });
</script>
</body>
</html>
