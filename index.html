<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ISBT scanner test</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f4f5; color: #18181b;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px; max-width: 520px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: #71717a; font-size: 14px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #d4d4d8; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  #stage { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #reticle {
    position: absolute; inset: 22% 8%; border: 2px solid rgba(255,255,255,.9);
    border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35);
  }
  button {
    font: inherit; font-weight: 600; width: 100%; padding: 14px;
    border-radius: 12px; border: 1px solid #d4d4d8; background: #fff; color: #18181b;
    margin-top: 10px; cursor: pointer;
  }
  button.primary { background: #18181b; color: #fff; border-color: #18181b; }
  button:disabled { opacity: .4; }
  select { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d4d4d8; margin-top: 10px; background:#fff; }
  .hit { border-left: 4px solid #16a34a; padding: 10px 12px; background: #f0fdf4; border-radius: 8px; margin-bottom: 8px; }
  .hit code { font-size: 15px; word-break: break-all; }
  .meta { color: #52525b; font-size: 13px; margin-top: 3px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #f4f4f5; }
  .ok { color: #15803d; font-weight: 600; }
  .bad { color: #b91c1c; font-weight: 600; }
  .empty { color: #71717a; font-size: 14px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
</style>
</head>
<body>

<h1>ISBT scanner test</h1>
<div class="sub">Point at the barcode on a blood bag. Nothing is stored or sent anywhere.</div>

<div class="card" style="padding:0;overflow:hidden;border:none">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="reticle"></div>
  </div>
</div>

<div class="card">
  <select id="cameras"></select>
  <button id="start" class="primary">Start camera</button>
  <button id="stop" disabled>Stop</button>
  <button id="torch" disabled>Torch</button>
</div>

<div class="card">
  <h2>Decodes</h2>
  <div id="hits"><div class="empty">Nothing yet. Hold steady about a hand's width away.</div></div>
</div>

<div class="card">
  <h2>Environment</h2>
  <div id="env"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const video = $("video");
  let reader = null, controls = null, track = null, started = 0;
  const seen = new Map();

  /* --- environment checks: these explain most failures --- */
  const env = [
    ["Secure context (HTTPS)", window.isSecureContext],
    ["Camera API available", !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)],
    ["ZXing loaded", typeof ZXing !== "undefined"],
    ["playsInline set", video.hasAttribute("playsinline")],
  ];
  $("env").innerHTML = env.map(([k, v]) =>
    `<div class="row"><span>${k}</span><span class="${v ? "ok" : "bad"}">${v ? "yes" : "no"}</span></div>`
  ).join("") + `<div class="row"><span>User agent</span></div><div class="meta">${navigator.userAgent}</div>`;

  if (!window.isSecureContext) {
    $("start").disabled = true;
    $("start").textContent = "Needs HTTPS — open the deployed URL";
  }

  async function listCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === "videoinput");
      $("cameras").innerHTML = cams.length
        ? cams.map((c, i) => `<option value="${c.deviceId}">${c.label || "Camera " + (i + 1)}</option>`).join("")
        : `<option value="">Default camera</option>`;
      // Prefer a rear camera when the labels tell us which is which.
      const back = cams.find(c => /back|rear|environment/i.test(c.label));
      if (back) $("cameras").value = back.deviceId;
    } catch (e) {
      $("cameras").innerHTML = `<option value="">Default camera</option>`;
    }
  }

  function record(text, format) {
    const now = performance.now();
    if (seen.has(text)) { seen.get(text).count++; return; }
    seen.set(text, { count: 1 });
    const secs = ((now - started) / 1000).toFixed(1);
    const el = document.createElement("div");
    el.className = "hit";
    el.innerHTML = `<code>${text.replace(/[<>&]/g, "")}</code>
      <div class="meta">${format} · first read after ${secs}s</div>`;
    const box = $("hits");
    if (box.querySelector(".empty")) box.innerHTML = "";
    box.prepend(el);
    if (navigator.vibrate) navigator.vibrate(60);
  }

  async function start() {
    $("start").disabled = true;
    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128,   // ISBT-128 labels
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.DATA_MATRIX,
        ZXing.BarcodeFormat.QR_CODE,
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      reader = new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 100 });
      started = performance.now();

      const deviceId = $("cameras").value || undefined;
      controls = await reader.decodeFromVideoDevice(deviceId, video, (result, err) => {
        if (result) record(result.getText(), result.getBarcodeFormat());
      });

      track = video.srcObject && video.srcObject.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      $("torch").disabled = !("torch" in caps);
      $("stop").disabled = false;
      $("start").textContent = "Scanning…";
      await listCameras();
    } catch (e) {
      $("start").disabled = false;
      $("start").textContent = "Start camera";
      alert("Camera didn't start: " + e.message +
        "\n\nIf you denied the permission earlier, reset it in Settings for this site.");
    }
  }

  function stop() {
    try { if (reader && reader.reset) reader.reset(); } catch (e) {}
    try { if (controls && controls.stop) controls.stop(); } catch (e) {}
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    $("start").disabled = false;
    $("start").textContent = "Start camera";
    $("stop").disabled = true;
    $("torch").disabled = true;
  }

  $("start").addEventListener("click", start);
  $("stop").addEventListener("click", stop);
  $("torch").addEventListener("click", async () => {
    if (!track) return;
    const on = track.getSettings().torch;
    try { await track.applyConstraints({ advanced: [{ torch: !on }] }); } catch (e) {}
  });
  $("cameras").addEventListener("change", () => { if (!$("stop").disabled) { stop(); start(); } });

  listCameras();
})();
</script>
</body>
</html>
